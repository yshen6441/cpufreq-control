# CPUFreqControl 自动构建 (macOS runner, 产出 arm64 + arm64e 双切片)
# 使用方法:
#   1. 把本工程 push 到 GitHub 仓库
#   2. Actions 页面会自动构建, 完成后下载 deb 产物
#   3. 也可手动触发: Actions -> Build -> Run workflow
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main

      - name: Checkout Theos
        uses: actions/checkout@main
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Install iOS SDK 16.5
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p theos/sdks
          tar -xJf /tmp/sdk.tar.xz -C theos/sdks
          ls theos/sdks

      - name: Build Package
        run: |
          brew install make xz ldid
          export THEOS=$PWD/theos
          gmake clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: CPUFreqControl-deb
          path: packages/*.deb
