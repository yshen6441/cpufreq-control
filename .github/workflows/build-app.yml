# DSH iOS App 自动构建: 内嵌 Node.js 本地运行 DSH (无需电脑)
# 流水线:
#   1. build-node: ubuntu (16GB) 交叉编译 node 22 for iOS -> NodeMobile.framework
#   2. app: macOS 组装 DSH runtime + 构建 App (deb + ipa)
name: Build iOS App

on:
  push:
    paths:
      - 'dsh-ios-app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 xz-utils

      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/xerub/ldid /tmp/ldid
          cd /tmp/ldid && bash make.sh
          sudo cp ldid /usr/local/bin/ldid

      - name: Install iOS SDK 17.0
        run: |
          curl -L -o /tmp/sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.0-SDKs/iPhoneOS17.0.sdk.zip
          mkdir -p /opt/theos/sdks
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/sdk.zip').extractall('/opt/theos/sdks')"
          rm -rf /opt/theos/sdks/__MACOSX
          bash scripts/fix-sdk.sh /opt/theos/sdks/iPhoneOS17.0.sdk

      - name: Checkout nodejs-mobile (node 22)
        uses: actions/checkout@main
        with:
          repository: nodejs-mobile/nodejs-mobile
          ref: update22-9-0
          path: tools/nodejs-mobile

      - name: Cross-compile Node.js 22 for iOS (~40-70min)
        run: |
          bash dsh-ios-app/scripts/build-node22-linux.sh \
            "$PWD/tools/nodejs-mobile" \
            "$PWD/dsh-ios-app/vendor" \
            "/opt/theos/sdks/iPhoneOS17.0.sdk"

      - name: Upload NodeMobile.framework
        uses: actions/upload-artifact@main
        with:
          name: NodeMobile-framework
          path: dsh-ios-app/vendor/NodeMobile.framework

  app:
    runs-on: macos-latest
    needs: build-node
    steps:
      - uses: actions/checkout@main

      - name: Download NodeMobile.framework
        uses: actions/download-artifact@main
        with:
          name: NodeMobile-framework
          path: dsh-ios-app/vendor/

      - name: Checkout Theos
        uses: actions/checkout@main
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Install iOS SDK 17.0 (含私有框架)
        run: |
          curl -L -o /tmp/sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.0-SDKs/iPhoneOS17.0.sdk.zip
          mkdir -p theos/sdks
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/sdk.zip').extractall('theos/sdks')"
          rm -rf theos/sdks/__MACOSX
          bash scripts/fix-sdk.sh theos/sdks/iPhoneOS17.0.sdk

      - name: Assemble DSH runtime
        run: |
          bash dsh-ios-app/scripts/assemble-runtime.sh

      - name: Build App (deb)
        run: |
          brew install make xz ldid
          export THEOS=$PWD/theos
          cd dsh-ios-app
          gmake clean package FINALPACKAGE=1

      - name: Package IPA
        run: |
          APP=$(find dsh-ios-app/.theos -name "DSH.app" -type d | head -1)
          echo "APP dir: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DSH.ipa Payload
          ls -la DSH.ipa

      - name: Upload deb
        uses: actions/upload-artifact@main
        with:
          name: DSH-app-deb
          path: dsh-ios-app/packages/*.deb

      - name: Upload ipa
        uses: actions/upload-artifact@main
        with:
          name: DSH-ipa
          path: DSH.ipa
