# DSH iOS App 自动构建: 内嵌 Node.js 本地运行 DSH (无需电脑)
# 产物: deb (Sileo 安装) + ipa
name: Build iOS App

on:
  push:
    paths:
      - 'dsh-ios-app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@main

      - name: Checkout Theos
        uses: actions/checkout@main
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Install iOS SDK 17.0 (含私有框架)
        run: |
          curl -L -o /tmp/sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.0-SDKs/iPhoneOS17.0.sdk.zip
          mkdir -p theos/sdks
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/sdk.zip').extractall('theos/sdks')"
          rm -rf theos/sdks/__MACOSX
          bash scripts/fix-sdk.sh theos/sdks/iPhoneOS17.0.sdk

      - name: Select Xcode 16 (node 22.9 与 Xcode 26 不兼容)
        run: |
          echo "可用 Xcode:"
          ls /Applications | grep -i xcode || true
          echo "当前: $(xcode-select -p)"
          for V in 16.4 16.3 16.2 16.1 16.0 15.4 15.2; do
            if [ -d "/Applications/Xcode_$V.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$V.app"
              echo "已选择 Xcode $V"
              break
            fi
          done
          xcode-select -p

      - name: "Free Disk Space (官方做法: 删多余 Xcode 与开发框架)"
        run: |
          sudo rm -rf /Library/Frameworks/Mono.framework
          sudo rm -rf /Library/Frameworks/Xamarin.iOS.framework
          sudo rm -rf /Library/Frameworks/Xamarin.Android.framework
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /usr/local/share/powershell
          SELECTED=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "保留: $SELECTED"
          for d in /Applications/Xcode_*.app; do
            if [ "$d" != "$SELECTED" ] && [ -d "$d" ]; then
              echo "删除: $d"
              sudo rm -rf "$d"
            fi
          done
          df -h / | tail -1

      - name: 内存诊断
        run: |
          sysctl hw.memsize
          vm_stat | head -6
          sysctl vm.swapusage
          ulimit -a

      - name: Checkout nodejs-mobile (node 22)
        uses: actions/checkout@main
        with:
          repository: nodejs-mobile/nodejs-mobile
          ref: update22-9-0
          path: tools/nodejs-mobile

      - name: Build Node.js 22 for iOS (~30-50min)
        run: |
          bash dsh-ios-app/scripts/build-node22-ios.sh "$PWD/tools/nodejs-mobile" "$PWD/dsh-ios-app/vendor" || {
            echo "=== JETSAM/内存诊断 ==="
            log show --last 3m --predicate 'eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memorystatus"' --style compact 2>/dev/null | tail -30
            df -h /
            sysctl vm.swapusage
            exit 1
          }

      - name: Assemble DSH runtime
        run: |
          bash dsh-ios-app/scripts/assemble-runtime.sh

      - name: Build App (deb)
        run: |
          brew install make xz ldid
          export THEOS=$PWD/theos
          cd dsh-ios-app
          gmake clean package FINALPACKAGE=1

      - name: Package IPA
        run: |
          APP=$(find dsh-ios-app/.theos -name "DSH.app" -type d | head -1)
          echo "APP dir: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DSH.ipa Payload
          ls -la DSH.ipa

      - name: Upload deb
        uses: actions/upload-artifact@main
        with:
          name: DSH-app-deb
          path: dsh-ios-app/packages/*.deb

      - name: Upload ipa
        uses: actions/upload-artifact@main
        with:
          name: DSH-ipa
          path: DSH.ipa
